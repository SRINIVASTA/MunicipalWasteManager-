name: Cloud APK Compiler
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Initialize Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Automatically Build Android App
        uses: gradle/actions/build-action@v4
        with:
          build-root-directory: android
          arguments: assembleDebug --no-daemon

      - name: Deploy Compiled Android Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanCity-Social-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
