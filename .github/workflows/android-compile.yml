name: Cloud APK Compiler
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Initialize Java JDK Runtime Environment
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Assign Execution Rights to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compile Native Debug Application Package
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Deploy Compiled Android Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanCity-Social-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
